<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f6fa">
  <title>Tempo — Appointments &amp; Reminders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M16 10.5V16l4 2.5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon sprite -->
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-sprite" aria-hidden="true">
    <symbol id="i-overview" viewBox="0 0 24 24">
      <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>

      <path d="m8.5 16.5 2 2 4.5-4.5"/>

    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01" stroke-width="2.6"/>
    </symbol>
    <symbol id="i-users" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
      <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
    </symbol>
    <symbol id="i-bell-ring" viewBox="0 0 24 24">
      <path d="M10.268 21a2 2 0 0 0 3.464 0"/>
      <path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
      <path d="M2 8c0-1.6.6-3 1.6-4M22 8c0-1.6-.6-3-1.6-4"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24">
      <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
      <path d="m15 5 4 4"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <path d="M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    </symbol>
    <symbol id="i-upload" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="i-video" viewBox="0 0 24 24">
      <path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/>
      <rect x="2" y="6" width="14" height="12" rx="2"/>
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24">
      <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01" stroke-width="2.2"/>
    </symbol>
    <symbol id="i-calendar-plus" viewBox="0 0 24 24">
      <path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M12 14v4M10 16h4"/>
    </symbol>
    <symbol id="i-database" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/>
      <path d="M3 12a9 3 0 0 0 18 0"/>
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24">
      <path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/>
      <circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/>
    </symbol>
    <symbol id="i-snooze" viewBox="0 0 24 24">
      <circle cx="12" cy="13" r="8"/><path d="M5 3 2 6M22 6l-3-3M9 10h6l-6 6h6"/>
    </symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24">
      <path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3Z"/>
    </symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="white" stroke-width="2"/>
            <path d="M12 7.5V12l3 2" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Tempo</span>
          <span class="brand-tagline">Appointments, in rhythm</span>
        </div>
      </div>

      <nav class="nav">
        <span class="nav-label">Workspace</span>
        <button class="nav-item" data-nav="dashboard">
          <svg class="icon"><use href="#i-overview"/></svg><span>Overview</span>
        </button>
        <button class="nav-item" data-nav="calendar">
          <svg class="icon"><use href="#i-calendar"/></svg><span>Calendar</span>
        </button>
        <button class="nav-item" data-nav="appointments">
          <svg class="icon"><use href="#i-list"/></svg><span>Appointments</span>
          <span class="nav-count" id="navApptCount"></span>
        </button>
        <button class="nav-item" data-nav="clients">
          <svg class="icon"><use href="#i-users"/></svg><span>Clients</span>
          <span class="nav-count" id="navClientCount"></span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-alert" id="sidebarAlertCard"></div>

      <button class="nav-item nav-settings" data-nav="settings">
        <svg class="icon"><use href="#i-settings"/></svg><span>Settings</span>
      </button>
      <div class="sidebar-foot">
        <span class="storage-dot"></span>
        <span id="storageStatus">Saved on this device</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
          <div class="page-heading">
            <h1 id="pageTitle">Overview</h1>
            <p id="pageSubtitle">Your day at a glance</p>
          </div>
        </div>

        <div class="topbar-right">
          <div class="search-wrap" id="searchWrap">
            <div class="global-search">
              <svg class="icon search-icon"><use href="#i-search"/></svg>
              <input type="search" id="globalSearch" placeholder="Search appointments, clients…"
                     autocomplete="off" aria-label="Search appointments and clients">
              <kbd class="search-kbd">/</kbd>
            </div>
            <div class="search-results" id="globalSearchResults" hidden></div>
          </div>

          <div class="bell-wrap">
            <button class="icon-btn bell-btn" id="bellBtn" aria-label="Notifications" aria-expanded="false">
              <svg class="icon"><use href="#i-bell"/></svg>
              <span class="bell-badge" id="bellBadge" hidden>0</span>
            </button>
            <div class="bell-panel" id="bellPanel" hidden>
              <div class="bell-head">
                <div>
                  <strong>Notifications</strong>
                  <span class="bell-sub" id="bellSub">Reminders appear here</span>
                </div>
                <button class="text-btn" data-action="mark-all-read">Mark all read</button>
              </div>
              <div class="bell-list" id="bellList"></div>
            </div>
          </div>

          <button class="btn btn-primary topbar-new" id="newApptBtn">
            <svg class="icon"><use href="#i-plus"/></svg>
            <span>New appointment</span>
          </button>
        </div>
      </header>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
  <div id="modalRoot"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite" aria-atomic="false"></div>
  <input type="file" id="importFile" accept="application/json,text/csv,.json,.csv" hidden>

  <script src="js/utils.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/store.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/views-dashboard.js"></script>
  <script src="js/views-calendar.js"></script>
  <script src="js/views-appointments.js"></script>
  <script src="js/views-clients.js"></script>
  <script src="js/views-settings.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/data-actions.js"></script>
  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
